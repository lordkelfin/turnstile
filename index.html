<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turnstile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1013; --panel:rgba(20,24,29,.86); --line:#3b424c; --ink:#e9edf0; --mute:#97a1ab;
  --blue:#46b0ff; --red:#ff5a48; --acid:#b6e03c;
  color-scheme: dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --panel:rgba(22,26,31,.9); } }
:root[data-theme="dark"]{ --panel:rgba(20,24,29,.86); }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:14px 18px;display:flex;gap:18px;align-items:flex-start;justify-content:space-between;pointer-events:none;flex-wrap:wrap}
#hud .left{max-width:420px}
#lvname{font-weight:800;font-size:22px;letter-spacing:.01em;line-height:1.1}
#brief{color:var(--mute);font-size:14px;line-height:1.4;margin-top:4px}
#hud .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:260px;flex:0 1 380px}
#phase{font-weight:800;font-size:15px;padding:3px 12px;border-radius:2px;border:1.5px solid currentColor}
#hud[data-phase=inv] #phase{color:var(--blue)}
#hud[data-phase=nor] #phase{color:var(--red)}
#hud[data-phase=inv] #phase::before{content:"◀ "}
#hud[data-phase=nor] #phase::after{content:" ▶"}
#o2wrap{width:100%;display:flex;align-items:center;gap:10px}
#o2txt{font-weight:600;font-size:14px;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:#232930;border-radius:1px;overflow:hidden}
#o2bar{height:100%;background:var(--blue);transition:width .25s linear}
#o2wrap.low #o2bar{background:var(--red)}
#o2wrap.low #o2txt{color:var(--red)}
#tl{width:100%;background:var(--panel);border:1px solid var(--line);padding:8px 10px;border-radius:3px}
#tlhead{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:4px}
#tltxt{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
#tlbody{position:relative}
.tlrow{display:flex;align-items:center;gap:8px;height:16px}
.tlrow .lab{width:128px;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlrow .track{position:relative;flex:1;height:6px;background:#232930}
.tlrow i{position:absolute;top:0;bottom:0}
.tlrow.need i{background:var(--red)} .tlrow.help i{background:var(--blue)} .tlrow.win i{background:#e9edf0}
#tlcurwrap{position:absolute;left:136px;right:0;top:-2px;bottom:-2px;pointer-events:none}
#tlcur{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#ffcf6a;box-shadow:0 0 6px #ffcf6a}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:min(560px,92vw);
  background:var(--panel);border-left:3px solid var(--ink);padding:10px 14px;font-size:15px;line-height:1.4;pointer-events:none}
#toast[data-tone=red]{border-left-color:var(--red)}

#overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,10,12,.55);padding:16px;overflow:auto}
#overlay[data-low='1']{place-items:end center;background:rgba(8,10,12,.2)}
#overlay[data-low='1'] #ocard{max-width:560px;padding:20px 24px}
#ach{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));z-index:20;display:flex;gap:14px;align-items:flex-start;
  width:min(440px,92vw);padding:14px 18px;background:var(--panel);border:1px solid #ffcf6a;border-radius:4px;box-shadow:0 0 30px rgba(255,207,106,.25);
  transform:translate(-50%,-140%);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .3s;pointer-events:none}
#ach.show{transform:translate(-50%,0);opacity:1}
#ach[hidden]{display:none}
.ach-icon{font-size:30px;line-height:1;color:#ffcf6a;background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ach-k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#ffcf6a;font-weight:600}
.ach-t{font-size:20px;font-weight:800;line-height:1.15;margin-top:2px}
.ach-d{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.35}
.ach-q{font-size:14px;margin-top:8px;line-height:1.4;color:#d3d9de}
.ach-q i{color:var(--ink)}
@media (prefers-reduced-motion: reduce){#ach{transition:none}}
#overlay[hidden],#toast[hidden],#hud[hidden],#o2wrap[hidden],#tl[hidden]{display:none}
#ocard{background:var(--panel);border:1px solid var(--line);max-width:620px;width:100%;padding:26px 28px;border-radius:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-height:calc(100% - 8px);overflow:auto}
#ocard h2{margin:0 0 8px;font-size:30px;font-weight:800;line-height:1.1}
#ocard p{margin:0 0 12px;font-size:16px;line-height:1.5;color:#d3d9de}
#ocard p.small{font-size:14px;color:var(--mute)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btns button,.lvl{background:#262c33;border:1px solid var(--line);padding:9px 18px;border-radius:2px;cursor:pointer;font-weight:600;font-size:16px}
.btns button.primary{background:var(--ink);color:#12161a;border-color:var(--ink)}
.btns button:hover,.lvl:hover:not(:disabled){border-color:var(--ink)}
.title{position:relative;font-weight:800;font-size:clamp(44px,11vw,84px);line-height:.9;letter-spacing:.02em;margin:0 0 14px;height:1em}
.title span{position:absolute;left:0;top:0}
.title .fwd{color:var(--red);mix-blend-mode:screen}
.title .rev{color:var(--blue);transform:scaleX(-1);transform-origin:center;width:100%;text-align:center;left:0;opacity:.55;mix-blend-mode:screen;clip-path:inset(0 0 48% 0)}
.title .fwd{width:100%;text-align:center;clip-path:inset(46% 0 0 0)}
.rules{margin:0 0 12px;padding-left:18px;font-size:15px;line-height:1.45;color:#d3d9de}
.rules li{margin-bottom:5px}
b.b{color:var(--blue)} b.r{color:var(--red)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.lvl{display:flex;gap:10px;align-items:baseline;text-align:left}
.lvl .num{color:var(--mute);font-variant-numeric:tabular-nums}
.lvl:disabled{opacity:.35;cursor:not-allowed}

.pad{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:200px;height:200px;display:none}
@media (pointer:coarse){ .pad{display:block} #toast{bottom:calc(196px + env(safe-area-inset-bottom,0px))} }
.pad button{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(30,35,41,.8);border:1.5px solid var(--line);font-size:22px;touch-action:none}
.pad button:active{border-color:var(--ink);background:rgba(60,68,78,.9)}
.pad [data-dir=up]{right:4px;top:4px} .pad [data-dir=right]{right:4px;bottom:4px}
.pad [data-dir=down]{left:4px;bottom:4px} .pad [data-dir=left]{left:4px;top:4px}
.pad span{display:inline-block}
.mute{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:rgba(30,35,41,.8);border:1px solid var(--line);color:var(--mute);font-size:12px;padding:5px 10px;border-radius:2px;cursor:pointer}
@media (pointer:coarse){.mute{left:calc(18px + env(safe-area-inset-left,0px));right:auto}}
.compass{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--mute);line-height:1.3}
@media (pointer:coarse){.compass{display:none}}
@media (max-width:700px){ #hud{padding:10px 12px} #lvname{font-size:18px} #brief{font-size:12.5px} #hud .right{min-width:0;flex:1 1 100%;align-items:stretch} #phase{align-self:flex-start} }
</style>
</head>
<body>
<canvas id="cv" aria-label="Game view"></canvas>
<div id="hud" hidden>
  <div class="left"><div id="lvname"></div><div id="brief"></div></div>
  <div class="right">
    <div id="phase"></div>
    <div id="o2wrap"><div class="bar"><div id="o2bar"></div></div><span id="o2txt"></span></div>
    <div id="tl" hidden>
      <div id="tlhead"><span>Timeline</span><span id="tltxt"></span></div>
      <div id="tlbody"><div id="tlrows"></div><div id="tlcurwrap"><div id="tlcur"></div></div></div>
    </div>
  </div>
</div>
<div id="toast" hidden></div>
<div class="compass" id="compass" aria-hidden="true"></div>
<button id="mute" class="mute" aria-pressed="true">Sound on</button>
<div class="pad" aria-label="Movement">
  <button data-dir="up" aria-label="Move up"><span>↑</span></button>
  <button data-dir="right" aria-label="Move right"><span>↑</span></button>
  <button data-dir="down" aria-label="Move down"><span>↑</span></button>
  <button data-dir="left" aria-label="Move left"><span>↑</span></button>
</div>
<div id="ach" role="status" aria-live="polite" hidden></div>
<div id="overlay" hidden><div id="ocard" role="dialog" aria-modal="true"></div></div>
<script>
const LEVELS = [
{
  name: 'Bridge', o2: 30,
  brief: 'Hold the blue plate long enough for your future self to cross the acid. Then reach the exit door.',
  map: [
    "#######",
    "##BR###",
    "#.....#",
    "#.###.#",
    "#.###=#",
    "#p###=#",
    "#.###=#",
    "#.###.#",
    "#.....#",
    "#D#S###"],
  legend: { p: { t: 'plate', c: 'b', id: 1 }, '=': { t: 'bridge', id: 1 } }
},
{
  name: 'Two doors', o2: 34,
  brief: 'Red things are your normal self’s job. You may walk through the red door now, but later you must hold its plate at exactly that moment.',
  map: [
    "#########",
    "###BR####",
    "##.....##",
    "##.###.##",
    "##d###p##",
    "##.###.##",
    "##q###e##",
    "##.###.##",
    "##.###.##",
    "##D###S##"],
  legend: { d: { t: 'door', id: 1 }, p: { t: 'plate', c: 'r', id: 1 }, q: { t: 'plate', c: 'b', id: 2 }, e: { t: 'door', id: 2 } }
},
{
  name: 'Beams', o2: 34,
  brief: 'Stand next to a console to switch its laser off. Blue consoles are yours; red ones belong to your normal self.',
  map: [
    "#########",
    "###BR####",
    "##.....##",
    "##.###.##",
    "##L##C.##",
    "##.###.##",
    "##.c##M##",
    "##.###.##",
    "##.###.##",
    "##D###S##"],
  legend: { L: { t: 'laser', id: 1, o: 'h' }, C: { t: 'console', c: 'r', id: 1 }, c: { t: 'console', c: 'b', id: 2 }, M: { t: 'laser', id: 2, o: 'h' } }
}
];
LEVELS.push({
  name: 'Overwatch', o2: 36,
  brief: 'The turret can’t fire while your inverted self walks right beside it. Use that to protect your normal self on the red plate. Waiting at the turnstile before you set off gives your normal self more time to step in.',
  map: [
    "#########",
    "###BR####",
    "##.....##",
    "##.###.##",
    "##=###.##",
    "##=X..p##",
    "##=###.##",
    "##.###.##",
    "##.###.##",
    "##D###S##"],
  legend: { '=': { t: 'bridge', id: 1 }, p: { t: 'plate', c: 'r', id: 1 }, X: { t: 'turret', c: 'b', r: 3.2 } }
});
LEVELS.push({
  name: 'Pincer', o2: 44,
  brief: 'Everything at once. Your normal self has to hack the red turret, cross your bridge and reach the red console, each at exactly the right moment.',
  map: [
    "#########",
    "###BR####",
    "##.....##",
    "##.###.##",
    "##L##K.##",
    "##.###.##",
    "##.###=##",
    "##q###=##",
    "##.###=##",
    "##.###.##",
    "##.Y...##",
    "##.###.##",
    "##.###.##",
    "##D###S##"],
  legend: { L: { t: 'laser', id: 1, o: 'h' }, K: { t: 'console', c: 'r', id: 1 }, q: { t: 'plate', c: 'b', id: 2 }, '=': { t: 'bridge', id: 2 }, Y: { t: 'turret', c: 'r', r: 1.5 } }
});
LEVELS.push({
  name: 'Lockstep', o2: 24,
  brief: 'Two parallel corridors. Walk past your blue console while your normal self needs the laser down, and be next to the red console when your inverted self steps through the red laser.',
  map: [
    "#############",
    "#B..L......D#",
    "#R##K###c####",
    "#.......M..S#",
    "#############"],
  legend: { L: { t: 'laser', id: 1, o: 'v' }, K: { t: 'console', c: 'r', id: 1 }, c: { t: 'console', c: 'b', id: 2 }, M: { t: 'laser', id: 2, o: 'v' } }
});
LEVELS.push({
  name: 'Relay', o2: 36,
  brief: 'A chain of favours, alternating between you. Work out the order your normal self will meet them in.',
  map: [
    "#########",
    "###BR####",
    "##.....##",
    "##=###.##",
    "##=###.##",
    "##.###P##",
    "##q###.##",
    "##.###.##",
    "##.###e##",
    "##d###.##",
    "##.###r##",
    "##.###.##",
    "##.###.##",
    "##D###S##"],
  legend: { '=': { t: 'bridge', id: 1 }, P: { t: 'plate', c: 'r', id: 1 }, q: { t: 'plate', c: 'b', id: 2 }, e: { t: 'door', id: 2 }, d: { t: 'door', id: 3 }, r: { t: 'plate', c: 'r', id: 3 } }
});
LEVELS.push({
  name: 'Mirror', o2: 32,
  brief: 'Your plate raises the bridge, but the red turret is watching you on it. Your normal self can only keep it hacked while crossing that same bridge.',
  map: [
    "#########",
    "###BR####",
    "##.....##",
    "##.###.##",
    "##.###.##",
    "##.###=##",
    "##q..Y=##",
    "##.###=##",
    "##.###.##",
    "##D###.##",
    "#####...#",
    "#####.#.#",
    "#####S#.#",
    "#####...#",
    "#########"],
  legend: { '=': { t: 'bridge', id: 1 }, q: { t: 'plate', c: 'b', id: 1 }, Y: { t: 'turret', c: 'r', r: 3.5 } }
});
LEVELS.push({
  name: 'Sentries', o2: 36,
  brief: 'Two turrets, one of each colour. Each of you can only stand still under fire while the other one is walking past the gun.',
  map: [
    "#########",
    "###BR####",
    "##.....##",
    "##.###.##",
    "##.###.##",
    "##.###=##",
    "##q..Y=##",
    "##.###=##",
    "##.###.##",
    "##.###.##",
    "##%###.##",
    "##%X..p##",
    "##%###.##",
    "##.###.##",
    "##D###S##"],
  legend: { '=': { t: 'bridge', id: 1 }, q: { t: 'plate', c: 'b', id: 1 }, Y: { t: 'turret', c: 'r', r: 3.5 },
            '%': { t: 'bridge', id: 2 }, p: { t: 'plate', c: 'r', id: 2 }, X: { t: 'turret', c: 'b', r: 3.2 } }
});
LEVELS.push({
  name: 'Palindrome', o2: 42,
  brief: 'The whole route reads the same in both directions. Every favour you do going down is one you collect coming up.',
  map: [
    "#########",
    "###BR####",
    "##.....##",
    "##.###.##",
    "##L##K.##",
    "##.###.##",
    "##q###.##",
    "##.###.##",
    "##.###e##",
    "##.###.##",
    "##..Y..##",
    "##.###.##",
    "##.c##M##",
    "##.###.##",
    "##%###.##",
    "##%X..p##",
    "##%###.##",
    "##.###.##",
    "##D###S##"],
  legend: { L: { t: 'laser', id: 1, o: 'h' }, K: { t: 'console', c: 'r', id: 1 }, q: { t: 'plate', c: 'b', id: 2 }, e: { t: 'door', id: 2 },
            Y: { t: 'turret', c: 'r', r: 2.3 }, c: { t: 'console', c: 'b', id: 3 }, M: { t: 'laser', id: 3, o: 'h' },
            '%': { t: 'bridge', id: 4 }, p: { t: 'plate', c: 'r', id: 4 }, X: { t: 'turret', c: 'b', r: 3.2 } }
});
LEVELS.push({
  name: 'Switchboard', o2: 40,
  brief: 'Three plates, three doors. Follow the cables: your normal self meets the doors from the bottom up, so in your run they have to happen in the opposite order.',
  map: [
    "###########",
    "###BR######",
    "###......##",
    "#....q##.##",
    "#p....##c##",
    "#.....##.##",
    "#.....##.##",
    "#.....##b##",
    "#.....##.##",
    "#r....##.##",
    "###.####a##",
    "###D####.##",
    "########S##"],
  legend: { r: { t: 'plate', c: 'b', id: 3 }, q: { t: 'plate', c: 'b', id: 2 }, p: { t: 'plate', c: 'b', id: 1 },
            c: { t: 'door', id: 3 }, b: { t: 'door', id: 2 }, a: { t: 'door', id: 1 } }
});
LEVELS.push({
  name: 'Crossed wires', o2: 36,
  brief: 'Two consoles and a plate, all wired to your normal self’s corridor. Trace each cable, then work them in the order that lets your normal self through. The red door on your way out is your normal self’s first job.',
  map: [
    "###########",
    "###BR######",
    "###......##",
    "#....K##.##",
    "#.....##L##",
    "#.....##.##",
    "#p....##M##",
    "#.....##.##",
    "#.k...##.##",
    "#.....##=##",
    "###d####=##",
    "###.####.##",
    "###D####r##",
    "########S##"],
  legend: { K: { t: 'console', c: 'b', id: 2 }, M: { t: 'laser', id: 2, o: 'h' }, k: { t: 'console', c: 'b', id: 3 }, L: { t: 'laser', id: 3, o: 'h' },
            p: { t: 'plate', c: 'b', id: 4 }, '=': { t: 'bridge', id: 4 }, d: { t: 'door', id: 5 }, r: { t: 'plate', c: 'r', id: 5 } }
});
LEVELS.push({
  name: 'Junction box', o2: 50,
  brief: 'Four controls, four obstacles. Read every cable before you leave the turnstile.',
  map: [
    "#############",
    "####BR#######",
    "####.......##",
    "#...#...##.##",
    "#......K##L##",
    "#.......##.##",
    "#.......##.##",
    "#p......##=##",
    "#.......##=##",
    "#.......##.##",
    "#.......##M##",
    "#.....k.##.##",
    "#.q.....##.##",
    "####d#####a##",
    "####D#####r##",
    "##########S##"],
  legend: { K: { t: 'console', c: 'b', id: 2 }, M: { t: 'laser', id: 2, o: 'h' },
            k: { t: 'console', c: 'b', id: 4 }, L: { t: 'laser', id: 4, o: 'h' },
            p: { t: 'plate', c: 'b', id: 3 }, '=': { t: 'bridge', id: 3 },
            q: { t: 'plate', c: 'b', id: 1 }, a: { t: 'door', id: 1 },
            d: { t: 'door', id: 5 }, r: { t: 'plate', c: 'r', id: 5 } }
});
LEVELS.push({
  name: 'Two rooms', o2: 52,
  brief: 'Two rooms of controls, and a red turret watching the passage between them. Your normal self has to hack it while you walk through.',
  map: [
    "#############",
    "####BR#######",
    "####.......##",
    "#...#..K##L##",
    "#.......##.##",
    "#.......##=##",
    "#.k.....##=##",
    "####.#####.##",
    "####.....Y.##",
    "####.#####.##",
    "#.p.....##.##",
    "#.......##M##",
    "#.......##.##",
    "#......o##a##",
    "####.#####.##",
    "####D#####S##"],
  legend: { K: { t: 'console', c: 'b', id: 1 }, '=': { t: 'bridge', id: 1 },
            k: { t: 'console', c: 'b', id: 2 }, L: { t: 'laser', id: 2, o: 'h' },
            Y: { t: 'turret', c: 'r', r: 5.5 },
            o: { t: 'plate', c: 'b', id: 3 }, M: { t: 'laser', id: 3, o: 'h' },
            p: { t: 'plate', c: 'b', id: 4 }, a: { t: 'door', id: 4 } }
});
LEVELS.push({
  name: 'Patch bay', o2: 56,
  brief: 'The control room runs along the top, your normal self’s corridor along the bottom. The cables drop straight down, just never to where you’d expect.',
  map: [
    "###############",
    "##.c........K##",
    "#B...........##",
    "#R#..........e#",
    "#.#.a.....k.#D#",
    "#.#############",

// ===== CORE (pure logic, no rendering) =====
const LAG = 2;
const DIRV = { up: [0, -1], right: [1, 0], down: [0, 1], left: [-1, 0] };

function parseLevel(def) {
  const H = def.map.length, W = Math.max(...def.map.map(r => r.length));
  const L = { def, W, H, tiles: [], ctrl: {}, turrets: [], plates: [], consoles: [], devs: [], B: null, R: null, D: null, S: null };
  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) {
      const ch = def.map[y][x] || ' ';
      let t = { base: 'floor', dev: null };
      if (ch === '#') t.base = 'wall';
      else if (ch === ' ') t.base = 'void';
      else if (ch === '~') t.base = 'acid';
      else if (ch === 'B') { t.special = 'B'; L.B = [x, y]; }
      else if (ch === 'R') { t.special = 'R'; L.R = [x, y]; }
      else if (ch === 'D') { t.special = 'D'; L.D = [x, y]; }
      else if (ch === 'S') { t.special = 'S'; L.S = [x, y]; }
      else if (ch !== '.') {
        const spec = def.legend[ch];
        if (!spec) throw new Error('Unknown char ' + ch);
        const d = Object.assign({ x, y }, spec);
        t.dev = d;
        if (spec.t === 'bridge') t.base = 'acid';
        if (spec.t === 'console' || spec.t === 'turret') t.base = 'solid';
        if (spec.t === 'plate' || spec.t === 'console') L.ctrl[spec.id] = d;
        if (spec.t === 'plate') L.plates.push(d);
        if (spec.t === 'console') L.consoles.push(d);
        if (spec.t === 'turret') L.turrets.push(d);
        L.devs.push(d);
      }
      row.push(t);
    }
    L.tiles.push(row);
  }
  // collapsing floor: whole rows of plain floor give way k steps before the pincer closes
  L.crumbles = [];
  for (const [y, k] of (def.collapse || [])) for (let x = 0; x < W; x++) {
    const t = L.tiles[y][x]; if (t.base === 'floor' && !t.dev && !t.special) { t.crumble = k; L.crumbles.push({ x, y, k }); }
  }
  // or a second map: a letter per tile names its zone, def.fallK gives that zone's k
  if (def.fall) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = (def.fall[y] || '')[x], k = ch && def.fallK[ch];
    const t = L.tiles[y][x]; if (k != null && t.base === 'floor' && !t.dev && !t.special) { t.crumble = k; L.crumbles.push({ x, y, k }); }
  }
  return L;
}

const eq = (a, b) => a && b && a[0] === b[0] && a[1] === b[1];

// Is controller `id` engaged? pos = {inv, nor}; returns true / false / 'spec' (speculative: future-normal will do it)
function ctrlState(L, id, pos, phase) {

}

  if (d.t === 'door') return ctrlState(L, d.id, pos, phase) ? null : 'door';

  if (t.special === 'R' && (who !== 'nor' || !ghostOnB)) return false;
  if (t.special === 'B' && who !== 'inv') return false;
  if (t.special === 'D' && who !== 'inv') return false;
  return hazard(L, p, pos, phase) === null;

// ---- leniency ----
const LINGER = 1;   // devices stay on this many ticks after being released
const GRACE = 1;    // a red job may be done this many ticks late
const WINDOW = 0;   // turnstile: both selves must step in at the same moment

// position of each self at tick t of a run
function posAt(run, t) {

}

// controller state with linger: true / false / 'spec'

}

// ---- Inverted phase ----
function newInv(L) {

}
function stepInv(L, s, dir) {

  L.turrets.forEach((tu, k) => {

    if (canSee(L, tu, np)) { s.shots.push({ tur: k, fire: i, land: i + LAG, at: np.slice() }); s.events.push('fire'); }
  });

// ---- Normal phase ----
function newNor(L, inv) {

  return { phase: 'nor', t: 0, T, rec: inv.rec, invShots: inv.shots, pos: L.S.slice(), prev: L.S.slice(), hist: [L.S.slice()], shots: [], pending: [], inGate: false, over: null, events: [] };
}

}

// ---------- layout ----------
function resize() {

  cv.width = VW * DPR; cv.height = VH * DPR; cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  layout();
}
function layout() {
  const L = G.L; if (!L) return;
  const top = VW < 700 ? 150 : 120, bot = matchMedia('(pointer: coarse)').matches ? 190 : 70;
  // fit the projected level (TW = 1) into the screen
  let minSX = 1e9, maxSX = -1e9, minSY = 1e9, maxSY = -1e9;
  for (let y = 0; y < L.H; y++) for (let x = 0; x < L.W; x++) for (const [u, v] of [[-.5, -.5], [.5, -.5], [.5, .5], [-.5, .5]]) {
    const sx = ((x + u) * CA - (y + v) * SA) / Math.SQRT2, sy = ((x + u) * SA + (y + v) * CA) / (2 * Math.SQRT2);
    minSX = Math.min(minSX, sx); maxSX = Math.max(maxSX, sx); minSY = Math.min(minSY, sy); maxSY = Math.max(maxSY, sy);
  }
  minSY -= 1.1; maxSY += 0.15; minSX -= 0.2; maxSX += 0.2;
  const aw = VW - 24, ah = Math.max(200, VH - top - bot);

  OY = top + (ah - (maxSY - minSY) * TW) / 2 - minSY * TW;
}

const YAW = 27 * Math.PI / 180, CA = Math.cos(YAW), SA = Math.sin(YAW);

    ctx.fillStyle = '#20242a'; ctx.beginPath(); ctx.arc(hx, hy - u * 0.01, u * 0.086, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    if (front) {
      ctx.fillStyle = '#2e333b'; ctx.beginPath(); ctx.ellipse(hx + u * 0.035, hy + u * 0.012, u * 0.06, u * 0.068, 0.1, 0, Math.PI * 2); ctx.fill();
      const glow = 0.7 + 0.3 * breathe; ctx.fillStyle = hexA(c, glow); ctx.shadowColor = c; ctx.shadowBlur = 9;
      ctx.beginPath(); ctx.arc(hx + u * 0.015, hy - u * 0.012, u * 0.021, 0, Math.PI * 2); ctx.arc(hx + u * 0.068, hy - u * 0.012, u * 0.019, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      // filter canister
      ctx.fillStyle = '#434a54'; ctx.save(); ctx.translate(hx + u * 0.06, hy + u * 0.058); ctx.rotate(-0.4); rr(-u * 0.028, -u * 0.022, u * 0.056, u * 0.05, u * 0.012); ctx.fill();
      ctx.fillStyle = '#1b1e22'; ctx.fillRect(-u * 0.02, u * 0.005, u * 0.04, u * 0.006); ctx.fillRect(-u * 0.02, u * 0.016, u * 0.04, u * 0.006); ctx.restore();
    }
    // breathing hose from mask to tank
    ctx.strokeStyle = '#3a414a'; ctx.lineWidth = u * 0.022; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(hx + (front ? u * 0.04 : -u * 0.02), hy + u * 0.07); ctx.quadraticCurveTo(hx - u * 0.12, hy + u * 0.12, -u * 0.09, hipY - u * 0.24); ctx.stroke();
  } else {
    // helmet with red visor
    ctx.fillStyle = '#24282e'; ctx.beginPath(); ctx.arc(hx, hy - u * 0.008, u * 0.088, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillRect(hx - u * 0.088, hy - u * 0.012, u * 0.176, u * 0.012);
    if (front) {
      ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 9; rr(hx - u * 0.005, hy - u * 0.008, u * 0.088, u * 0.032, u * 0.014); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#2b2f36'; ctx.beginPath(); ctx.arc(hx - u * 0.06, hy + u * 0.005, u * 0.02, 0, Math.PI * 2); ctx.fill(); // earpiece
    } else { ctx.fillStyle = hexA(c, .7); ctx.fillRect(hx - u * 0.05, hy - u * 0.05, u * 0.05, u * 0.012); }
  }
  // near arm
  const nearArm = lerp(armSw(sw) + lean, 1.5, armsUp), nearFore = lerp(nearArm + 0.55, 2.85, armsUp);
  const [gx, gy] = limb(u * 0.075, shY + u * 0.03, nearArm, u * 0.11, nearFore, u * 0.1, u * 0.058, u * 0.052, '#1a1d22');
  ctx.fillStyle = '#0c0d10'; ctx.beginPath(); ctx.arc(gx, gy, u * 0.025, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function shotLine(tu, at, f, c) {
  const [tx, ty] = P(tu.x, tu.y), [ix, iy] = P(at[0], at[1]);
  const a = [tx, ty - TW * 0.36], b = [ix, iy - TW * 0.25];
  const px = lerp(a[0], b[0], f), py = lerp(a[1], b[1], f), qx = lerp(a[0], b[0], Math.max(0, f - 0.15)), qy = lerp(a[1], b[1], Math.max(0, f - 0.15));
  ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.shadowColor = c; ctx.shadowBlur = 10; ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(px, py); ctx.stroke(); ctx.shadowBlur = 0;
}
function spark(at, k, c) { const [ix, iy] = P(at[0], at[1]); ctx.fillStyle = hexA(c, k); ctx.beginPath(); ctx.ellipse(ix, iy, TW * 0.25 * (1.2 - k), TW * 0.12 * (1.2 - k), 0, 0, Math.PI * 2); ctx.fill(); }
function drawShots(tn, pk) {
  const L = G.L;
  const list = pk === 'inv' ? (G.s ? G.s.shots : []) : (G.n ? G.n.shots : []);
  for (const sh of list) {
    const f = (tn - sh.fire) / (sh.land - sh.fire);
    if (f >= 0 && f <= 1) shotLine(L.turrets[sh.tur], sh.at, f, '#ffcf6a');
    const k = 1 - Math.abs(tn - sh.land) * 2; if (k > 0) spark(sh.at, k, '#ffcf6a');
  }
  if (pk === 'nor' && G.n) for (const sh of G.n.invShots) { // ghost's shots, played backwards
    const gf = G.n.T - sh.fire, gl = G.n.T - sh.land;
    const f = (tn - gl) / (gf - gl);
    if (f >= 0 && f <= 1) shotLine(L.turrets[sh.tur], sh.at, 1 - f, hexA(COL.blue, 0.9));
    const k = 1 - Math.abs(tn - gl) * 2; if (k > 0) spark(sh.at, k, COL.blue);
  }
}
function burst(at, c) { const [x, y] = P(at[0], at[1]); for (let i = 0; i < 40; i++) G.parts.push({ x, y: y - TW * 0.3, vx: (Math.random() - .5) * 6, vy: -Math.random() * 6, life: 1, c, big: true }); }
function drawParts(pk) {
  if (!reduceMotion && G.mode !== 'title' && Math.random() < 0.5 && G.parts.length < 160) G.parts.push({ x: Math.random() * VW, y: pk === 'inv' ? VH + 5 : -5, vx: 0, vy: pk === 'inv' ? -(0.3 + Math.random() * 0.5) : (0.3 + Math.random() * 0.5), life: 1, c: pk === 'inv' ? COL.blue : COL.red });
  G.parts = G.parts.filter(p => p.life > 0 && p.y > -10 && p.y < VH + 10);
  for (const p of G.parts) {
    p.x += p.vx; p.y += p.vy; if (p.big) { p.vy += 0.25; p.life -= 0.025; } else p.life -= 0.002;
    ctx.fillStyle = hexA(p.c, (p.big ? 1 : 0.25) * p.life); ctx.fillRect(p.x, p.y, p.big ? 3 : 1.5, p.big ? 3 : 1.5);
  }
}

function orientControls() {
  const V = { up: [0, -1], right: [1, 0], down: [0, 1], left: [-1, 0] }, ang = {};
  for (const k in V) { const [dx, dy] = V[k]; ang[k] = Math.atan2((dx * SA + dy * CA) / 2, dx * CA - dy * SA); }
  document.querySelectorAll('.pad button').forEach(b => {
    const a = ang[b.dataset.dir]; b.style.left = (69 + Math.cos(a) * 70) + 'px'; b.style.top = (69 + Math.sin(a) * 70) + 'px';
    b.style.right = 'auto'; b.style.bottom = 'auto'; b.querySelector('span').style.transform = `rotate(${a + Math.PI / 2}rad)`;
  });
  const arrow = k => `<span style="display:inline-block;transform:rotate(${ang[k] + Math.PI / 2}rad)">↑</span>`;
  $('compass').innerHTML = `↑ ${arrow('up')}&nbsp; → ${arrow('right')}&nbsp; ↓ ${arrow('down')}&nbsp; ← ${arrow('left')}&nbsp; · M sound`;
}
$('mute').onclick = () => { setMuted(!muted); if (!muted) sfx('ui'); };
setMuted(muted); orientControls();
resize(); showTitle(); requestAnimationFrame(frame);

</script>
</body>
